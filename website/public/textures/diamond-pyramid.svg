<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Top-Left Facet: primary light catch (highlight) -->
    <linearGradient id="facetTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2f38"/>
      <stop offset="60%" stop-color="#1c1e24"/>
      <stop offset="100%" stop-color="#14151a"/>
    </linearGradient>

    <!-- Top-Right Facet: diffuse light reflection -->
    <linearGradient id="facetTR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2026"/>
      <stop offset="60%" stop-color="#131418"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>

    <!-- Bottom-Left Facet: ambient shadow -->
    <linearGradient id="facetBL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="60%" stop-color="#0e0f12"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <!-- Bottom-Right Facet: deep cast shadow -->
    <linearGradient id="facetBR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#040405"/>
      <stop offset="60%" stop-color="#08090b"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
  </defs>

  <!-- Deep dark base plate -->
  <rect width="32" height="32" fill="#060608"/>

  <!-- Center Diamond Pyramid (Peak at 16, 16) -->
  <polygon points="16,0 0,16 16,16" fill="url(#facetTL)"/>
  <polygon points="16,0 32,16 16,16" fill="url(#facetTR)"/>
  <polygon points="0,16 16,32 16,16" fill="url(#facetBL)"/>
  <polygon points="32,16 16,32 16,16" fill="url(#facetBR)"/>

  <!-- 4 Corner Seamless Extension Pyramids -->
  <polygon points="0,0 16,0 0,16" fill="url(#facetBR)"/>
  <polygon points="32,0 16,0 32,16" fill="url(#facetBL)"/>
  <polygon points="32,32 32,16 16,32" fill="url(#facetTL)"/>
  <polygon points="0,32 0,16 16,32" fill="url(#facetTR)"/>

  <!-- Subtle Micro-Groove Bevel Edges -->
  <line x1="0" y1="0" x2="32" y2="32" stroke="#000000" stroke-width="0.8" stroke-opacity="0.85"/>
  <line x1="32" y1="0" x2="0" y2="32" stroke="#000000" stroke-width="0.8" stroke-opacity="0.85"/>
  <line x1="16" y1="0" x2="16" y2="32" stroke="#000000" stroke-width="0.4" stroke-opacity="0.4"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="#000000" stroke-width="0.4" stroke-opacity="0.4"/>

  <!-- Specular Peak Highlight -->
  <circle cx="16" cy="16" r="0.6" fill="#3a3e4a" opacity="0.6"/>
  <circle cx="0" cy="0" r="0.6" fill="#3a3e4a" opacity="0.6"/>
  <circle cx="32" cy="0" r="0.6" fill="#3a3e4a" opacity="0.6"/>
  <circle cx="32" cy="32" r="0.6" fill="#3a3e4a" opacity="0.6"/>
  <circle cx="0" cy="32" r="0.6" fill="#3a3e4a" opacity="0.6"/>
</svg>
